
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Shopping List - PantryPal</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="logo">PantryPal</div>
    <div class="menu">
        <a href="/">Dashboard</a>
        <a href="/pantry">Pantry</a>
        <a href="/recipes">Recipes</a>
        <a href="/shopping">Shopping</a>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Shopping List 🛒</h1>
            <p>รายการของที่ครอบครัวต้องซื้อ</p>
        </div>

        <a href="/shopping/add" class="btn">+ เพิ่มรายการ</a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>วัตถุดิบ</th>
                    <th>จำนวน</th>
                    <th>สถานะ</th>
                    <th>จัดการ</th>
                </tr>
            </thead>

            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.ingredient_name }}</td>
                    <td>{{ item.quantity }} {{ item.unit }}</td>
                    <td>{{ item.status }}</td>
                    <td>
                        <form method="POST"
                              action="{{ url_for('shopping_status', item_id=item.shopping_id) }}">
                            <button class="btn" type="submit">
                                เปลี่ยนสถานะ
                            </button>
                        </form>

                        <form method="POST"
                              action="{{ url_for('delete_shopping', item_id=item.shopping_id) }}"
                              onsubmit="return confirm('ลบรายการนี้หรือไม่?')">
                            <button class="delete" type="submit">
                                ลบ
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">ยังไม่มีรายการซื้อของ</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
